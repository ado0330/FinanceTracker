name: FinanceTracker
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""          # Leave blank for free account / local signing
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.10.0"
    CURRENT_PROJECT_VERSION: "27"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES

targets:
  FinanceTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: FinanceTracker
        excludes:
          - "**/.DS_Store"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.FinanceTracker
        PRODUCT_NAME: FinanceTracker
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        # SwiftData / CloudKit — local only, no entitlements needed
        ENABLE_USER_SCRIPT_SANDBOXING: NO

    entitlements:
      path: FinanceTracker/FinanceTracker.entitlements

    info:
      path: FinanceTracker/Info.plist
      properties:
        CFBundleDisplayName: FinanceTracker
        CFBundleName: FinanceTracker
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: YES
        UIRequiresFullScreen: NO
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.local.FinanceTracker
            CFBundleURLSchemes:
              - financetracker
        NSCameraUsageDescription: "FinanceTracker uses the camera to scan and itemize receipts for splitting expenses."
        NSPhotoLibraryUsageDescription: "FinanceTracker needs photo library access to automatically detect and scan receipt screenshots for bookkeeping."
        NSUserNotificationsUsageDescription: "FinanceTracker needs notifications to alert you when you exceed a budget."
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: "com.local.FinanceTracker.ftbackup"
            UTTypeDescription: "FinanceTracker Backup File"
            UTTypeConformsTo:
              - "com.apple.package"
            UTTypeTagSpecification:
              public.filename-extension:
                - "ftbackup"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: NO

  FinanceTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: FinanceTrackerTests
        excludes:
          - "**/.DS_Store"

    dependencies:
      - target: FinanceTracker

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.FinanceTrackerTests
        PRODUCT_NAME: FinanceTrackerTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FinanceTracker.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FinanceTracker"

schemes:
  FinanceTracker:
    build:
      targets:
        FinanceTracker: all
        FinanceTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FinanceTrackerTests
